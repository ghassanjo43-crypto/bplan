# Render Blueprint — one Docker web service running the full app.
# Create a new Blueprint in Render and point it at this repo, or set up a
# Web Service with runtime "Docker" and Dockerfile path ./Dockerfile.
services:
  - type: web
    name: bplan
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BP_SEED_ON_STARTUP
        value: "true"
      # Initial admin account (seeded on first boot only). Set these in the
      # Render dashboard or uncomment and provide values here. If omitted, the
      # insecure code defaults are used (admin@example.com / ChangeMe123!).
      # - key: ADMIN_EMAIL
      #   value: admin@example.com
      # - key: ADMIN_PASSWORD
      #   sync: false   # set the value in the Render dashboard (do not commit secrets)
      # - key: ADMIN_FULL_NAME
      #   value: System Administrator
      # JWT signing secrets — MUST be set to strong random values in production.
      # - key: JWT_SECRET_KEY
      #   generateValue: true
      # - key: JWT_REFRESH_SECRET_KEY
      #   generateValue: true
      # Persist data across deploys by attaching a disk and pointing the data
      # dir at it (uncomment the disk block + this var; requires a paid plan).
      # - key: BP_DATA_DIR
      #   value: /data
    # disk:
    #   name: bplan-data
    #   mountPath: /data
    #   sizeGB: 1
